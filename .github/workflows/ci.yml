name: Media CI
on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  hermes-team:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install profile YAML reader for installer tests
        run: python -m pip install 'PyYAML==6.0.3'
      - name: Check Hermes installer without credentials
        run: python -m unittest discover -s tests/hermes -p 'test_*.py' -v
      - name: Check out pinned Hermes for native integration
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 11c50f05d070b2158afdca73f077d2501ecd77fc
          path: .hermes-ci
          persist-credentials: false
      - name: Install isolated Hermes test runtime
        run: |
          python -m venv "$RUNNER_TEMP/hermes-test"
          "$RUNNER_TEMP/hermes-test/bin/python" -m pip install -e './.hermes-ci[telegram]'
      - name: Verify real profiles, provider routing, gateway config and Kanban worktrees
        env:
          MEDIA_HERMES_BIN: ${{ runner.temp }}/hermes-test/bin/hermes
          MEDIA_HERMES_PYTHON: ${{ runner.temp }}/hermes-test/bin/python
        run: python -m unittest discover -s tests/hermes -p 'test_*.py' -v
  caddy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test Caddy
        run: sudo apt-get update && sudo apt-get install -y caddy
      - name: Check Caddy reload, rollback and existing sites
        run: python3 -m unittest discover -s tests/deployment -p test_caddy.py -v
      - name: Check installer with existing Caddy and missing Docker
        run: sudo python3 -m unittest discover -s tests/deployment -p test_installer.py -v
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: media_test
          POSTGRES_USER: media_test
          POSTGRES_PASSWORD: ci-only-not-production
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U media_test -d media_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, pdo_sqlite, pdo_pgsql, gd, bcmath, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
      - run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: media_test
          DB_USERNAME: media_test
          DB_PASSWORD: ci-only-not-production
      - run: php artisan view:cache
      - name: Check PWA cache isolation and offline fallback
        run: node --test tests/pwa/service-worker.test.cjs
      - name: Install browser verification runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/media-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/media-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify mobile navigation, search, PWA and profile in browser
        env:
          APP_ENV: local
          APP_URL: http://127.0.0.1:8085
          MEDIA_DEMO: 'true'
          MEDIA_NOINDEX: 'true'
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ runner.temp }}/media-browser.sqlite
          MEDIA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/media-browser/node_modules/playwright
          MEDIA_BROWSER_OUTPUT: ${{ runner.temp }}/media-browser-results
        run: |
          touch "$DB_DATABASE"
          php artisan migrate --seed --force
          php artisan db:seed --class=DemoSeeder --force
          php artisan serve --host=127.0.0.1 --port=8085 --no-reload > "$RUNNER_TEMP/media-browser-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8085/up
          node tests/pwa/browser.cjs
      - name: Save browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-browser-review
          path: ${{ runner.temp }}/media-browser-results
          retention-days: 14
      - run: for script in scripts/*.sh; do bash -n "$script"; done && python3 -m py_compile scripts/init-env.py && node --check public/assets/app.js && node --check public/sw.js
      - name: Build production image
        run: docker build --target production -t mahad-media:ci .
      - name: Start production and development containers
        run: |
          MEDIA_IMAGE=mahad-media:ci python3 scripts/init-env.py
          bash scripts/start.sh dev
          bash scripts/start.sh prod
          bash scripts/compose.sh dev exec -T -u www-data app php artisan db:seed --class=DemoSeeder --force
          curl --fail --retry 3 --retry-delay 2 http://127.0.0.1:8081/up
          curl --fail http://127.0.0.1:8081/ -o /tmp/media-prod.html
          curl --fail http://127.0.0.1:8082/ -o /tmp/media-dev.html
          grep -q 'Naskah pertama' /tmp/media-prod.html
          grep -q 'Membaca zaman' /tmp/media-dev.html
      - name: Backup and restore development
        run: |
          bash scripts/backup.sh dev
          backup=$(find .deploy/backups -maxdepth 1 -type d -name 'dev-*' | sort | tail -1)
          bash scripts/restore.sh dev "$backup"
          curl --fail http://127.0.0.1:8082/ -o /tmp/media-restored.html
          grep -q 'Membaca zaman' /tmp/media-restored.html
      - name: Stop application containers
        if: always()
        run: |
          if [ -f .deploy/dev.env ]; then bash scripts/compose.sh dev down --volumes; fi
          if [ -f .deploy/prod.env ]; then bash scripts/compose.sh prod down --volumes; fi
