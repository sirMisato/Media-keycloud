services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: media_test
      POSTGRES_USER: media_test
      POSTGRES_PASSWORD: ci-only-not-production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_test -d media_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  test:
    build: {context: ., target: test}
    environment:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_DATABASE: media_test
      DB_USERNAME: media_test
      DB_PASSWORD: ci-only-not-production
    depends_on:
      db: {condition: service_healthy}
    command: ["php", "artisan", "test"]
