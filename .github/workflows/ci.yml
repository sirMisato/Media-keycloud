name: Media CI
on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  caddy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test Caddy
        run: sudo apt-get update && sudo apt-get install -y caddy
      - name: Check Caddy reload, rollback and existing sites
        run: python3 -m unittest discover -s tests/deployment -p test_caddy.py -v
      - name: Check installer with existing Caddy and missing Docker
        run: sudo python3 -m unittest discover -s tests/deployment -p test_installer.py -v
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: media_test
          POSTGRES_USER: media_test
          POSTGRES_PASSWORD: ci-only-not-production
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U media_test -d media_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, pdo_sqlite, pdo_pgsql, gd, bcmath, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
      - run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: media_test
          DB_USERNAME: media_test
          DB_PASSWORD: ci-only-not-production
      - run: php artisan view:cache
      - run: for script in scripts/*.sh; do bash -n "$script"; done && python3 -m py_compile scripts/init-env.py && node --check public/assets/app.js && node --check public/sw.js
      - name: Build production image
        run: docker build --target production -t mahad-media:ci .
      - name: Start production and development containers
        run: |
          MEDIA_IMAGE=mahad-media:ci python3 scripts/init-env.py
          bash scripts/start.sh dev
          bash scripts/start.sh prod
          bash scripts/compose.sh dev exec -T -u www-data app php artisan db:seed --class=DemoSeeder --force
          curl --fail --retry 3 --retry-delay 2 http://127.0.0.1:8081/up
          curl --fail http://127.0.0.1:8081/ -o /tmp/media-prod.html
          curl --fail http://127.0.0.1:8082/ -o /tmp/media-dev.html
          grep -q 'Naskah pertama' /tmp/media-prod.html
          grep -q 'Membaca zaman' /tmp/media-dev.html
      - name: Backup and restore development
        run: |
          bash scripts/backup.sh dev
          backup=$(find .deploy/backups -maxdepth 1 -type d -name 'dev-*' | sort | tail -1)
          bash scripts/restore.sh dev "$backup"
          curl --fail http://127.0.0.1:8082/ -o /tmp/media-restored.html
          grep -q 'Membaca zaman' /tmp/media-restored.html
      - name: Stop application containers
        if: always()
        run: |
          if [ -f .deploy/dev.env ]; then bash scripts/compose.sh dev down --volumes; fi
          if [ -f .deploy/prod.env ]; then bash scripts/compose.sh prod down --volumes; fi
